[project]
name = "mcpacer"
version = "0.1.0"
description = "AI Running Coach powered by Claude + Strava - MCP server for personalized training plans and coaching"
readme = "README.md"
authors = [
    { name = "Peter Werner" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=0.1.0",
    "rich>=13.0.0",
    "requests>=2.32.5",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.18.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcpacer-server = "mcpacer:main"
mcpacer-analyze-plan = "mcpacer.cli.analyze_plan:main"
mcpacer-generate-calendar = "mcpacer.cli.generate_calendar:main"
mcpacer-update-data = "mcpacer.cli.update_data:main"
mcpacer = "mcpacer.web.launcher:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[project.urls]
"Homepage" = "https://github.com/peteskomoroch/mcpacer"
"Bug Tracker" = "https://github.com/peteskomoroch/mcpacer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpacer"]

[tool.hatch.build]
only-packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
